<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập hoặc tạo tài khoản Robot Assembly Lab để chuẩn bị cho tính năng lưu tiến độ lắp ráp">
  <title>Tài khoản | Robot Assembly Lab</title><link rel="stylesheet" href="../assets/css/style.css">
  <meta name="theme-color" content="#0e1215">
  <link rel="icon" href="../assets/icons/cpu-chip.svg" type="image/svg+xml">
</head>
<body class="account-page">
  <a class="skip-link" href="#main-content">Chuyển đến nội dung</a>
  <div class="account-backdrop" aria-hidden="true"></div>
  <main class="account-shell" id="main-content" tabindex="-1">
    <section class="account-form-pane">
      <a class="brand account-brand" href="../index.html" aria-label="Robot Assembly Lab — Trang chủ">
        <span class="brand-mark"><svg class="icon" width="24" height="24" focusable="false" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon">
  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 0 0 2.25-2.25V6.75a2.25 2.25 0 0 0-2.25-2.25H6.75A2.25 2.25 0 0 0 4.5 6.75v10.5a2.25 2.25 0 0 0 2.25 2.25Zm.75-12h9v9h-9v-9Z"/>
</svg></span>
        <span class="brand-name">ROBOT<span>ASSEMBLY LAB</span></span>
      </a>

      <div class="account-form-wrap">
        <p class="section-label">Tài khoản</p>
        <h1>Đăng nhập hoặc tạo tài khoản</h1>

        <div class="auth-tabs" role="tablist" aria-label="Chọn hình thức truy cập">
          <button class="auth-tab" id="tab-login" type="button" role="tab" data-tab="login" aria-selected="true" aria-controls="panel-login" tabindex="0">Đăng nhập</button>
          <button class="auth-tab" id="tab-signup" type="button" role="tab" data-tab="signup" aria-selected="false" aria-controls="panel-signup" tabindex="-1">Đăng ký</button>
        </div>

        <section id="panel-login" class="auth-panel" role="tabpanel" aria-labelledby="tab-login">
          <form id="login-form" novalidate>
            <div class="form-field">
              <label for="login-email">Email</label>
              <input id="login-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-field">
              <label for="login-password">Mật khẩu</label>
              <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" required>
            </div>
            <p class="form-note" role="status"></p>
            <button class="button auth-submit" type="submit">Đăng nhập</button>
          </form>
        </section>

        <section id="panel-signup" class="auth-panel" role="tabpanel" aria-labelledby="tab-signup" hidden>
          <form id="signup-form" novalidate>
            <div class="form-field">
              <label for="signup-name">Họ tên</label>
              <input id="signup-name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="form-field">
              <label for="signup-email">Email</label>
              <input id="signup-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-field">
              <label for="signup-password">Mật khẩu</label>
              <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="signup-password-hint">
              <p class="form-hint" id="signup-password-hint">Ít nhất 8 ký tự.</p>
            </div>
            <div class="form-field">
              <label for="signup-confirm">Nhập lại mật khẩu</label>
              <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <p class="form-note" role="status"></p>
            <button class="button auth-submit" type="submit">Tạo tài khoản</button>
          </form>
        </section>

      </div>

      <p class="account-footnote">© 2026 Robot Assembly Lab · <a href="../index.html">Quay lại trang chủ</a></p>
      <noscript><p class="note-box">Bật JavaScript để chuyển đổi giữa Đăng nhập và Đăng ký, và để kiểm tra thông tin trước khi gửi.</p></noscript>
    </section>

    <aside class="account-visual" aria-label="Cánh tay robot mini">
      <img src="../assets/images/robots/robot-arm-mini.png" alt="Cánh tay robot mini" width="1024" height="1024" fetchpriority="high" decoding="async">
    </aside>
  </main>
  <script src="../assets/js/account.js"></script>
</body>
</html>
