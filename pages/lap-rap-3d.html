<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Lắp ráp Robot 3D</title>

    <link
            rel="stylesheet"
            href="../assets/css/style.css"
    >
</head>

<body class="assembly-3d-page">

<header class="assembly-3d-header">
    <a class="assembly-3d-back" href="lap-rap.html">
        <span aria-hidden="true">←</span>
        Quay lại thư viện
    </a>

    <div class="assembly-3d-title">
        <span>Phòng thực hành số 03</span>
        <h1>Lắp ráp Robot 3D</h1>
    </div>

    <div class="assembly-3d-model-chip">
        <span>Đang thao tác</span>
        <strong id="model-name">Robot dò đường</strong>
    </div>
</header>

<main class="assembly-3d-workspace">
    <section class="assembly-3d-view" aria-label="Mô hình robot 3D tương tác">
        <div class="assembly-3d-stage-meta" aria-hidden="true">
            <span class="assembly-3d-live-dot"></span>
            Không gian lắp ráp trực tiếp
        </div>

        <div id="assembly-3d-canvas"></div>

        <div class="assembly-3d-toolbar" role="group" aria-label="Điều khiển góc nhìn mô hình">
            <button id="assembly-3d-rotate-left" type="button" aria-label="Xoay mô hình sang trái">↶</button>
            <button id="assembly-3d-focus" type="button" aria-label="Căn giữa mô hình">◎</button>
            <button id="assembly-3d-rotate-right" type="button" aria-label="Xoay mô hình sang phải">↷</button>
            <span aria-hidden="true"></span>
            <button id="assembly-3d-zoom-out" type="button" aria-label="Thu nhỏ mô hình">−</button>
            <button id="assembly-3d-zoom-in" type="button" aria-label="Phóng to mô hình">+</button>
        </div>

        <p class="assembly-3d-view-hint">Kéo để xoay · Cuộn để thu phóng</p>
    </section>

    <aside class="assembly-3d-panel">
        <header class="assembly-3d-panel-header">
            <span>Quy trình lắp ráp</span>
            <h2>Linh kiện</h2>
            <p id="assembly-3d-summary"></p>
        </header>

        <p id="assembly-3d-status" role="status" aria-live="polite">
            Hãy chọn linh kiện để bắt đầu lắp ráp.
        </p>

        <div class="assembly-3d-list-heading">
            <span>Danh sách</span>
            <strong id="assembly-3d-counter">0/0 nhóm</strong>
        </div>

        <div id="assembly-3d-parts" class="assembly-3d-parts"></div>

        <div class="assembly-3d-progress">
            <div>
                <span>Tiến độ hoàn thành</span>
                <strong id="assembly-3d-progress-value">0%</strong>
            </div>
            <progress id="assembly-3d-progress" max="100" value="0">0%</progress>
        </div>

        <div class="assembly-3d-panel-actions">
            <button id="assembly-3d-explode" type="button" aria-pressed="false">
                Tách linh kiện
            </button>
            <button id="assembly-3d-reset" type="button">
                Lắp lại từ đầu
            </button>
        </div>
    </aside>
</main>


<!-- =========================
     JAVASCRIPT
     ========================= -->

<!-- Three.js cục bộ: không phụ thuộc kết nối CDN khi chạy trong phòng máy. -->
<script src="/vendor/three/three.min.js"></script>


<!-- Dữ liệu robot -->
<script src="../assets/js/data.js"></script>


<!-- Cấu hình vị trí 3D -->
<script src="../assets/js/assembly-3d-config.js"></script>

<!-- Thư viện hình học cho từng linh kiện -->
<script src="../assets/js/assembly-3d-parts.js"></script>


<!-- Logic lắp ráp 3D -->
<script src="../assets/js/assembly-3d.js"></script>

</body>

</html>
